
name: HTML Linter CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: HTML Validator
        uses: CyberspaceMan/html-validator-action@v1
        with:
          file-path: 'index.html'
