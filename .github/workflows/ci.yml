name: HTML Linter CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Validate HTML
        uses: HtmlHint/htmlhint-action@v1
        with:
          path: 'index.html'